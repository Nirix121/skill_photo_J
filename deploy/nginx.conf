# nginx перед приложением: HTTPS снаружи, обычный http на 127.0.0.1:3000 внутри.
# Положите в /etc/nginx/sites-available/palmira и включите симлинком в sites-enabled.
# Замените example.com на свой домен.

# Не пишем путь и query: адрес сертификата и путь панели являются секретами.
log_format palmira_safe '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    access_log /var/log/nginx/palmira-access.log palmira_safe;
    error_log  /var/log/nginx/palmira-error.log crit;

    # Проверка домена для Let's Encrypt, всё остальное — на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовок ставит и приложение, но для редиректов nginx он тоже нужен.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Дополнительный документ к сертификату может быть крупным — см. MAX_DOC_MB в .env.
    client_max_body_size 32m;

    access_log /var/log/nginx/palmira-access.log palmira_safe;
    error_log  /var/log/nginx/palmira-error.log crit;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Генерация PDF ограничена очередью; оставляем запас времени на загруженном сервере.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Проверка живости — наружу отдавать незачем.
    location /health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
}
